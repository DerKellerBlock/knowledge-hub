domain: davinci_resolve
version: 1
description: "Golden Dataset for DaVinci Resolve domain quality evaluation"
last_updated: 2026-07-01
# Quality Metrics v2 (2026-07-07): discriminative metrics
# NDCG@10 replaces constant TKR, Jaccard replaces ±2 PMA, WSR replaces binary SR
# Source Diversity (Shannon entropy) rewards multi-source spread
weights:
  source_recall: 0.25          # Weighted Source Recall
  page_metadata_accuracy: 0.15 # Jaccard Page Overlap
  top_k_relevance: 0.20        # NDCG@10
  evidence_quality: 0.10       # Evidence Quality (reduced)
  image_presence: 0.20         # Vision Retrieval (image questions only)
  source_diversity: 0.10       # Source Diversity (DaVinci has 10 PDFs)
# thresholds:
#   pass: 0.7
#   weak: 0.4
