  - id: godot-003
    question: "What are the gotchas with CharacterBody3D and Jolt Physics in Godot 4.6?"
    expected_source_files:
      - "gotchas.md"
      - "godot-docs-reference-packed.md"
    expected_page_ranges: []
    real_world_sources:
      - url: "https://github.com/godotengine/godot/issues/117857"
        date: "2026-03-26"
        type: "github-issue"
        solution_summary: "Bug: Using CharacterBody3D move_and_collide() from _process() (not _physics_process()) with Jolt physics sometimes fails to generate collision responses. Fixed in 4.7. Workaround: use _physics_process() or adjust collision logic."
        has_solution: true
      - url: "https://github.com/godotengine/godot/issues/112315"
        date: "2025-11-02"
        type: "github-issue"
        solution_summary: "Bug: CharacterBody3D apply_floor_snap() onto an AnimatableBody3D can cause catapulting when velocity.y has a small positive value. Workaround: explicitly set velocity.y = 0 when on floor."
        has_solution: true
      - url: "https://github.com/godotengine/godot/issues/113058"
        date: "2025-11-22"
        type: "github-issue"
        solution_summary: "Bug: Reparenting a CharacterBody3D with KeepGlobalTransform=true falsely triggers distant Area3D nodes at world origin. Confirmed, assigned, open. Only occurs with Jolt physics, not Godot Physics."
        has_solution: false
    difficulty: medium
    tags: [characterbody3d, jolt, physics, gotcha]
    created_date: 2026-06-29
    last_verified: 2026-06-29
    notes: "From Answer-Synthesis Spec Testfall 6 (personal notes priority)."
