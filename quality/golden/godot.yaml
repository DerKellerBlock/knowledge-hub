  - id: godot-005
    question: "How do I fix GLB model import scale issues from Meshy in Godot?"
    expected_source_files:
      - "gotchas.md"
    expected_page_ranges: []
    real_world_sources:
      - url: "https://github.com/godotengine/godot/issues/111653"
        date: "2025-10-14"
        type: "github-issue"
        solution_summary: "Bug: Mesh origin point shifts away from world origin when scaling imported GLB/OBJ geometry (not Godot-native QuadMesh). Affects GLB and OBJ. Open, no fix. Disabling 'Generate LODs' is part of reproduction."
        has_solution: false
      - url: "https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_3d_scenes/model_export_considerations.html"
        date: null
        type: "official-docs"
        solution_summary: "Official 3D model export conventions. Godot uses right-handed Y-up coordinates, -Z camera forward, +Z asset front. Recommends triangulation before export, Apply Transforms in Blender, 1 unit = 1 meter. Post-import scaling can cause floating-point precision issues."
        has_solution: true
      - url: "https://github.com/godotengine/godot/issues/97022"
        date: "2024-09-14"
        type: "github-issue"
        solution_summary: "Bug: GLTF nodes using 'matrix' instead of TRS (translation/rotation/scale) had incorrect bone rest transforms (Identity). Fixed in 4.4. Relevant for GLB import issues with scaling/rotation."
        has_solution: true
    difficulty: medium
    tags: [glb, import, scale, meshy, gotcha]
