  # === sc-gotchas-1: Jolt + apply_floor_snap + AnimatableBody3D ===
  - id: godot_spotcheck-gotchas-1
    question: "Why does my CharacterBody3D get launched into the air when I use apply_floor_snap() on a moving platform with Jolt physics?"
    expected_source_files:
      - "gotchas.md"
    expected_page_ranges: []
    real_world_sources:
      - url: "https://github.com/godotengine/godot/issues/112315"
        date: "2025-11-02"
        type: "github-issue"
        solution_summary: "Bug: apply_floor_snap() on AnimatableBody3D with Jolt physics catapults CharacterBody3D when velocity.y is a small positive value. Workaround: zero velocity.y before apply_floor_snap() — if is_zero_approx(velocity.y): velocity.y = 0. Reproducible in 4.4, 4.5.1, 4.6.dev2. Open, confirmed."
        has_solution: true
    difficulty: medium
    tags: [jolt, physics, characterbody3d, floor_snap, animatablebody3d, moving-platform, gotcha]
    created_date: "2026-07-03"
    last_verified: "2026-07-03"
    notes: "Spot-Check-Frage für gotchas.md. Adressiert die Sektion 'Jolt: apply_floor_snap() katapultiert auf AnimatableBody3D'. Pure personal, kein repo-Overlap."
    min_top_k: 10
  # === sc-bestpractices-1: Custom Resource + class_name ===
  - id: godot_spotcheck-bestpractices-1
    question: "I created a custom Resource script with @export variables for my inventory items, but it doesn't show up in the 'Create New Resource' dialog. How do I make it appear there?"
    expected_source_files:
      - "best-practices.md"
    expected_page_ranges: []
    real_world_sources:
      - url: "https://docs.godotengine.org/en/stable/tutorials/scripting/resources.html#creating-your-own-resources"
        date: null
        type: "official-docs"
        solution_summary: "To make a custom Resource appear in the Create New Resource dialog, the script must use class_name in GDScript. Without class_name, you must manually create an empty Resource and assign the script in the Inspector."
        has_solution: true
    difficulty: easy
    tags: [custom-resource, class_name, inventory, item-data, editor, inspector, best-practice]
    created_date: "2026-07-03"
    last_verified: "2026-07-03"
    notes: "Spot-Check-Frage für best-practices.md. Adressiert die Sektion 'Custom Resource als Item-Daten-Container'. Pure personal, kein repo-Overlap."
    min_top_k: 10
  # === sc-tips-1: AnimationTree + BlendSpace2D ===
  - id: godot_spotcheck-tips-1
    question: "I set up an AnimationTree with BlendSpace2D for my 3D character but the animations won't play. The AnimationPlayer works fine on its own. What am I missing?"
    expected_source_files:
      - "tips.md"
    expected_page_ranges: []
    real_world_sources:
      - url: "https://docs.godotengine.org/en/stable/tutorials/animation/animation_tree.html"
        date: null
        type: "official-docs"
        solution_summary: "AnimationTree requires: (1) anim_player set to a valid AnimationPlayer node, (2) active = true, (3) tree_root set to an animation node. Without all three, no animations will play."
        has_solution: true
    difficulty: easy
    tags: [animationtree, blendspace2d, locomotion, character, animation, active, anim_player, tip]
    created_date: "2026-07-03"
    last_verified: "2026-07-03"
    notes: "Spot-Check-Frage für tips.md. Adressiert die Sektion 'AnimationTree + BlendSpace2D für Character Locomotion'. Pure personal, kein repo-Overlap."
    min_top_k: 10