name: Test

# Runs the fast test layers (unit, integration, mcp) on every push and
# pull_request. Quality and e2e layers require a prebuilt index and are
# not run here — see Phase 2 Quality Gate plans.
#
# Decision (Noah, 2026-06-30, see
# docs/superpowers/specs/2026-06-30-improvement-roadmap-phase1-low-hanging-fruit-design.md
# §1.1): Python 3.11 only, ubuntu-latest, no version matrix, no macOS runner.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Cache HuggingFace model hub
        # First CI run downloads ~2 GB of sentence-transformers models and
        # the BM25/cross-encoder weights. Caching cuts the next run from
        # minutes to seconds. Cache key is invalidated when requirements.txt
        # changes (new model version pins).
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/
          key: huggingface-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            huggingface-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint changed Python files
        run: |
          find . -name "*.py" -not -path "*/.venv/*" -not -path "*/__pycache__/*" -not -path "./chromadb_data/*" -print0 \
            | xargs -0 python -m py_compile

      - name: Lint changed shell files
        run: |
          find . -name "*.sh" -not -path "*/.venv/*" -not -path "*/node_modules/*" -print0 \
            | xargs -0 -n1 bash -n

      - name: Run unit tests
        run: pytest -m unit --tb=short -q

      - name: Run integration tests
        run: pytest -m integration --tb=short -q

      - name: Run MCP contract tests
        run: pytest -m mcp --tb=short -q
