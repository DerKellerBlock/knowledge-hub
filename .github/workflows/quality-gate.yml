name: Quality Gate

on:
  schedule:
    - cron: '0 5 * * 1'    # Weekly Monday 05:00 UTC (before update-knowledge at 06:00)
  workflow_dispatch:         # Manual trigger for post-iteration validation

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true          # Godot packed-files are LFS-tracked (Decision 2.3)

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Cache HuggingFace model hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/
          # Key includes config.py so a KH_EMBEDDING_MODEL / KH_RERANKER_MODEL
          # default change invalidates the cache (B5 fix from phase 2a review).
          key: huggingface-${{ runner.os }}-${{ hashFiles('requirements.txt', 'mcp_servers/knowledge_hub/config.py') }}
          restore-keys: |
            huggingface-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Set embedding model (BGE-M3)
        run: echo "KH_EMBEDDING_MODEL=BAAI/bge-m3" >> $GITHUB_ENV

      # jina multilingual reranker = CI default since 2026-07-01 (LIM-007/LIM-008).
      # Note: the HF cache key hashes config.py, not this env value, so the first
      # jina CI run downloads ~560 MB; subsequent runs reuse the HF cache.
      - name: Set reranker model (jina multilingual)
        run: echo "KH_RERANKER_MODEL=jinaai/jina-reranker-v2-base-multilingual" >> $GITHUB_ENV

      - name: Build Godot index
        run: python scripts/embed_index.py --domain godot

      - name: Build DaVinci index
        run: python scripts/embed_index.py --domain davinci_resolve

      - name: Evaluate Godot vs baseline
        run: |
          python scripts/quality/run_evaluation.py --domain godot \
            --baseline quality/baselines/godot-latest.json \
            --output quality/reports/godot_ci.json

      - name: Evaluate DaVinci vs baseline
        run: |
          python scripts/quality/run_evaluation.py --domain davinci_resolve \
            --baseline quality/baselines/davinci_resolve-latest.json \
            --output quality/reports/davinci_ci.json

      - name: Regression gate
        run: python scripts/quality/check_regression_exit.py quality/reports/godot_ci.json quality/reports/davinci_ci.json

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: quality/reports/*_ci.*
